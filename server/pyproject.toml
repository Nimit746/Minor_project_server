[project]
name = "server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.108",
    "cloudinary>=1.46.2",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "langchain>=1.4.3",
    "langchain-anthropic>=1.7.5",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.6",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.6.7",
    "langchain-qdrant>=1.1.0",
    "langgraph>=1.2.12",
    "langsmith>=0.14.4",
    "motor>=3.7.1",
    "pydantic[email]>=2.13.5",
    "pydantic-core>=2.46.5",
    "pydantic-settings>=2.15.0",
    "pymongo>=4.13,<4.18",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.1.0",
    "torch==2.12.1",
    "uvicorn>=0.54.0",
    "pypdf>=6.19.0",
    "pypdf2>=3.0.1",
    "qdrant-client>=1.19.1",
    "tavily-python>=0.8.4",
    "tabulate>=0.10.0",
    "python-docx>=1.2.0",
    "ddgs>=9.16.0",
    "arq>=0.28.0",
    "bcrypt>=5.0.0",
    "python-multipart>=0.0.32",
    "langgraph-checkpoint-mongodb>=0.5.0",
]


[tool.setuptools.packages.find]
include = ["app*","Agentic_wf*"]


[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]


[tool.uv.sources]
torchvision = { index = "pytorch-cpu" , marker = "sys_platform == 'linux'" }
torchaudio = { index = "pytorch-cpu" , marker = "sys_platform == 'linux'" }
torch = { index = "pytorch-cpu" }
