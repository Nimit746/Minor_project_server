services:
  app:
    build: ./server
    container_name: backend_server
    ports:
      - "8000:8000"
    env_file:
      - ./server/.env
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    init: true

  worker:
    build: ./server
    container_name: backend_worker
    command: ["uv", "run", "arq", "app.tasks.worker.WorkerSettings"]
    env_file:
      - ./server/.env
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    init: true

  redis:
    image: redis:7-alpine
    container_name: redis
    command:
      - redis-server
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
      - --save
      - ""
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  uploads_data:
